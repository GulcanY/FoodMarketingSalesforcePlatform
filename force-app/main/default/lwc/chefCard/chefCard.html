<template>

    <template lwc:if={chef}>
        <lightning-card class="container">
            <div class="slds-var-m-around_medium">
                <!--Chef image-->
                <div class="slds-var-m-around_small">
                    <template lwc:if={chefImage}>
                        <img src={chefImage} alt="Chef Image" class="image"/>
                    </template>
                    <header>
                        <h2 class="slds-var-m-around_small chefName">{chef.Name__c}</h2>
                    </header>
                    <p class="slds-align_absolute-center">
                        <span style="font-size:175%;color:yellow;">&starf;</span>
                        {chef.AvgRate__c}
                    </p>
                </div>
                <dl class="slds-list_horizontal slds-wrap">
                    <dt class="slds-item_label slds-text-color_weak">Cuisine:</dt>
                    <dd class="slds-item_detail">{chef.Cuisine_Type__c}</dd>
                    <dt class="slds-item_label slds-text-color_weak">Location:</dt>
                    <dd class="slds-item_detail">{chef.City__c} {chef.State__c}</dd>
                    <dt class="slds-item_label slds-text-color_weak">Pickup / Delivery:</dt>
                    <dd class="slds-item_detail">{chef.Pickup_Delivery_Preference__c}</dd>
                    <template lwc:if={chef.Social_Media_Links__c}>
                        <dt class="slds-item_label slds-text-color_weak">Social Media:</dt>
                        <dd class="slds-item_detail">
                            <lightning-formatted-url value={chef.Social_Media_Links__c} target="_blank"></lightning-formatted-url>
                        </dd>
                    </template>
                </dl>
                <template lwc:if={chef.Bio__c}>
                    <div class="contact-info">About the Chef</div>
                    <lightning-formatted-rich-text value={chef.Bio__c}></lightning-formatted-rich-text>
                </template>

                <!-- Display related food images -->
                <div class="contact-info">Chef's Dishes</div>
                <div class="slds-var-m-around_medium">
                    <template lwc:if={hasFoods}>
                        <div class="food-details">
                            <template for:each={foodDetails} for:item="food">
                                <div key={food.foodId} class="food-item">
                                    <template lwc:if={food.imageUrl}>
                                        <img src={food.imageUrl} alt={food.foodName} class="food-image"/>
                                    </template>
                                    <div class="food-info">
                                        <div class="food-name">{food.foodName}</div>
                                        <div class="food-price">
                                            <lightning-formatted-number value={food.foodPrice} format-style="currency" currency-code="USD"></lightning-formatted-number>
                                        </div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                    <template lwc:else>
                        <em>No dishes available right now.</em>
                    </template>
                </div>
            </div>
        </lightning-card>
    </template>
    <template lwc:elseif={notFound}>
        <lightning-card>
            <div class="slds-var-m-around_medium">
                <em>This chef is not available.</em>
            </div>
        </lightning-card>
    </template>
    <template lwc:else>
        <lightning-card>
            <div class="slds-var-m-around_medium">
                <em>Please select a chef to see the full details.</em>
            </div>
        </lightning-card>
    </template>
</template>
