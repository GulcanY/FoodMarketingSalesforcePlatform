<template>
    <template lwc:if={hasSlides}>
        <section class="carousel" aria-roledescription="carousel" aria-label="Home-cooked dishes">
            <div class="viewport" aria-live={liveMode}>
                <template for:each={viewSlides} for:item="slide">
                    <figure key={slide.id} class={slide.className} aria-roledescription="slide" aria-label={slide.label} aria-hidden={slide.ariaHidden}>
                        <img src={slide.imageUrl} alt="" aria-hidden="true" class="slide-backdrop" />
                        <img src={slide.imageUrl} alt={slide.name} class="slide-image" />
                    </figure>
                </template>
            </div>

            <template lwc:if={hasMultiple}>
                <button type="button" class="control arrow prev" aria-label="Previous slide" onclick={handlePrevious}>
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </button>
                <button type="button" class="control arrow next" aria-label="Next slide" onclick={handleNext}>
                    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5 L16 12 L9 19" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                </button>
                <div class="toolbar">
                    <button type="button" class="control play" aria-label={playPauseLabel} title={playPauseLabel} onclick={handleTogglePlay}>
                        <template lwc:if={isPlaying}>
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5 V19 M16 5 V19" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path></svg>
                        </template>
                        <template lwc:else>
                            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 5 L19 12 L8 19 Z" fill="currentColor"></path></svg>
                        </template>
                    </button>
                    <span class="counter">{counter}</span>
                </div>
            </template>
        </section>
    </template>
</template>
